- apt:
    pkg:
    - ufw
    - nginx
    state: latest

- ufw:
    rule: allow
    port: '80'
    proto: tcp

- ufw:
    state: "enabled"
    logging: "on"

- copy:
    dest: "/etc/nginx/sites-available/default"
    src: "default"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: restart nginx

- file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    owner: root
    group: root
    state: link
  notify: restart nginx
