    groups: ["sudoless", "sudo", "adm"]
- authorized_key:
    user: "ansimi"
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINs+rhRzCZ34a5lw2Lo6ukbW3rzlZPGVs7HCxyvvXbAc tuxedo
- copy:
